name: Build Quest APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r proxy/requirements.txt pytest httpx
      - run: python -m pytest -q proxy/tests

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space (Android IL2CPP images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          MENTOR_ENDPOINT: ${{ secrets.MENTOR_ENDPOINT }}
          MENTOR_TOKEN: ${{ secrets.MENTOR_TOKEN }}
        with:
          targetPlatform: Android
          buildMethod: SeptoMentor.EditorTools.BuildScript.Build
          buildName: SeptoMentor
          androidExportType: androidPackage
          versioning: None

      - uses: actions/upload-artifact@v4
        with:
          name: SeptoMentor-apk
          path: build/Android
          if-no-files-found: error
